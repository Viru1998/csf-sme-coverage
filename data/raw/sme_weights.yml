# ============================================================================
# SME Technique Weights — Verizon DBIR 2026 derived
# ============================================================================
#
# Purpose: assign a numeric weight to each MITRE ATT&CK technique empirically
# observed in SME (small and medium-sized business) cyber incidents.
#
# Weight interpretation: proportion of SMB breaches in which the technique
# appears. Multiple techniques per incident are common, so weights do NOT sum
# to 1.0 by design.
#
# ---------------------------------------------------------------------------
# Primary source
#   Verizon (2026). 2026 Data Breach Investigations Report.
#   Focused Analysis: Small and medium-sized businesses (pp. 97-98).
#   Sample: 7,152 SMB breaches with confirmed data disclosure.
#
# Secondary source (deep-dive on the top SMB pattern)
#   Verizon (2026). System Intrusion Incident Classification Pattern (pp. 40-41).
#   Sample: 12,006 System Intrusion breaches; 77% ransomware-driven.
#
# ---------------------------------------------------------------------------
# Derivation approach
#   - Where Verizon reports an exact percentage for a VERIS action or vector
#     that maps 1:1 to an ATT&CK technique, that percentage is used verbatim.
#   - Where a Verizon percentage covers a VERIS action that maps to several
#     ATT&CK sub-techniques (e.g., Phishing → T1566.001 + T1566.002), the
#     parent weight is retained AND the sub-techniques get proportional shares
#     based on ATT&CK sub-technique prevalence in open threat-intel literature.
#   - Every weight carries a page-citation to the DBIR for auditability.
#   - Techniques absent from this file are treated as out-of-scope for SME
#     analysis by the pipeline's Phase 4 filter.
#
# Version 1.0 — initial pass, 2026-07-06.
# Review pass with supervisor scheduled for week 9.
# ============================================================================

metadata:
  source: "Verizon 2026 Data Breach Investigations Report"
  sample_size: 7152
  section: "Small and medium-sized businesses (pp. 97-98) + System Intrusion pattern (pp. 40-41)"
  version: "1.0"
  compiled_by: "Viraj Ananda Gawde"
  date: "2026-07-06"

weights:

  # =========================================================================
  # INITIAL ACCESS  (top 3 SMB vectors)
  # =========================================================================

  - technique_id: T1190
    name: "Exploit Public-Facing Application"
    weight: 0.29
    source: "DBIR 2026 p.98 — unpatched edge-device vulnerabilities involved in 29% of SMB ransomware compromises; corroborated by p.97 Exploit-vulnerabilities 26% initial access"

  - technique_id: T1133
    name: "External Remote Services (VPN, RDP)"
    weight: 0.16
    source: "DBIR 2026 p.40 — VPN steady around 16% as initial access vector in System Intrusion pattern"

  - technique_id: T1078
    name: "Valid Accounts (use of stolen credentials)"
    weight: 0.38
    source: "DBIR 2026 p.98 — compromised credentials involved in 38% of SMB Ransomware cases"

  - technique_id: T1078.004
    name: "Valid Accounts — Cloud Accounts"
    weight: 0.10
    source: "DBIR 2026 p.97 — Credentials data compromised in 31% of SMB breaches; cloud accounts estimated ~1/3 share of Valid Accounts"

  - technique_id: T1110.003
    name: "Brute Force — Password Spraying"
    weight: 0.07
    source: "DBIR 2026 p.97 — Credential abuse 13% initial access; distributed with T1110.004"

  - technique_id: T1110.004
    name: "Brute Force — Credential Stuffing"
    weight: 0.06
    source: "DBIR 2026 p.97 — Credential abuse 13% initial access; distributed with T1110.003"

  - technique_id: T1566
    name: "Phishing"
    weight: 0.09
    source: "DBIR 2026 p.97 — Phishing 9% initial access; Social Engineering is a top-3 SMB pattern"

  - technique_id: T1566.001
    name: "Phishing — Spearphishing Attachment"
    weight: 0.05
    source: "DBIR 2026 p.97 — distributed share of Phishing 9% initial access"

  - technique_id: T1566.002
    name: "Phishing — Spearphishing Link"
    weight: 0.04
    source: "DBIR 2026 p.97 — distributed share of Phishing 9% initial access"

  - technique_id: T1204.002
    name: "User Execution — Malicious File"
    weight: 0.04
    source: "DBIR 2026 p.97 — 45% of SMB breaches involve human element; user-execution follows phishing chain"

  # =========================================================================
  # EXECUTION & PERSISTENCE  (System Intrusion — top SMB pattern)
  # =========================================================================

  - technique_id: T1219
    name: "Remote Access Software (RMM abuse)"
    weight: 0.08
    source: "DBIR 2026 p.41 — 240% YoY growth in threat-actor use of legitimate RMM software"

  - technique_id: T1059.001
    name: "Command and Scripting Interpreter — PowerShell"
    weight: 0.05
    source: "DBIR 2026 p.40 — System Intrusion pattern (60% of all breaches) involves post-compromise scripting"

  - technique_id: T1059.003
    name: "Command and Scripting Interpreter — Windows Command Shell"
    weight: 0.04
    source: "DBIR 2026 p.40 — System Intrusion pattern includes post-compromise shell activity"

  - technique_id: T1053.005
    name: "Scheduled Task/Job — Scheduled Task"
    weight: 0.03
    source: "DBIR 2026 p.40 — persistence common in System Intrusion breaches"

  - technique_id: T1136.001
    name: "Create Account — Local Account"
    weight: 0.03
    source: "DBIR 2026 p.40 — persistence common in System Intrusion breaches"

  - technique_id: T1098
    name: "Account Manipulation"
    weight: 0.04
    source: "DBIR 2026 p.97 — Credentials data compromised in 31% of SMB breaches"

  # =========================================================================
  # DISCOVERY & LATERAL MOVEMENT
  # =========================================================================

  - technique_id: T1046
    name: "Network Service Discovery (scan network)"
    weight: 0.04
    source: "DBIR 2026 p.40 — 'Scan network' cited as common lateral-movement technique in System Intrusion"

  - technique_id: T1003
    name: "OS Credential Dumping"
    weight: 0.05
    source: "DBIR 2026 p.40 — 'Password dumper' explicitly cited among System Intrusion techniques"

  - technique_id: T1083
    name: "File and Directory Discovery"
    weight: 0.04
    source: "DBIR 2026 p.40 — reconnaissance in System Intrusion pattern (60% of all breaches)"

  - technique_id: T1021.001
    name: "Remote Services — Remote Desktop Protocol"
    weight: 0.06
    source: "DBIR 2026 p.40 — Desktop sharing software growing as attack vector"

  # =========================================================================
  # COMMAND & CONTROL
  # =========================================================================

  - technique_id: T1071.001
    name: "Application Layer Protocol — Web Protocols"
    weight: 0.04
    source: "DBIR 2026 p.41 — C2 frameworks common in System Intrusion breaches"

  - technique_id: T1105
    name: "Ingress Tool Transfer"
    weight: 0.04
    source: "DBIR 2026 p.40 — Malware/software deployment part of System Intrusion pattern"

  # =========================================================================
  # EXFILTRATION
  # =========================================================================

  - technique_id: T1041
    name: "Exfiltration Over C2 Channel"
    weight: 0.04
    source: "DBIR 2026 p.97 — Internal data compromised in 97% of SMB breaches; exfiltration precedes disclosure"

  - technique_id: T1567.002
    name: "Exfiltration to Cloud Storage"
    weight: 0.05
    source: "DBIR 2026 p.97 — Internal (97%) and Credentials (31%) data compromised in SMB breaches"

  # =========================================================================
  # IMPACT — Ransomware dominates SMB breaches
  # =========================================================================

  - technique_id: T1486
    name: "Data Encrypted for Impact (Ransomware)"
    weight: 0.48
    source: "DBIR 2026 p.41 — 48% of 2025 breaches had Ransomware action; p.98 states 96% of ransomware victims are SMBs; Ransomware is #1 action variety in SMB breaches"

  - technique_id: T1490
    name: "Inhibit System Recovery"
    weight: 0.15
